name: CI

# Solo se dispara por push/pull_request normales (nunca pull_request_target,
# que ejecutaría este workflow con permisos del repo base sobre código de un fork).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el workflow solo lee el repo, no escribe nada
# (sin esto, GitHub concede por defecto permisos de escritura al GITHUB_TOKEN).
permissions:
  contents: read

# Cancela una ejecución anterior de la misma rama si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (sin dependencias externas)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # Acciones fijadas por SHA de commit (no por tag mutable) para evitar
      # que una acción de terceros cambie de contenido bajo el mismo tag.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verificar que no hay dependencias externas
        run: |
          python -c "import ast,sys
          for path in ('scripts/rfm_generic.py','rfm-333/scripts/rfm_333.py'):
              tree = ast.parse(open(path, encoding='utf-8').read(), path)
              stdlib = set(sys.stdlib_module_names)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split('.')[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      mods = [node.module.split('.')[0]] if node.module else []
                  else:
                      continue
                  bad = [m for m in mods if m not in stdlib]
                  if bad:
                      sys.exit(f'{path}: import no estandar detectado: {bad}')
          print('OK: solo librería estándar en los dos scripts')
          "

      - name: Variante quintiles (rfm_generic.py) sobre el CSV de ejemplo
        run: |
          python scripts/rfm_generic.py --input ejemplo/clientes_ejemplo.csv \
            --mode aggregated --id-col ID --recency-col Recency \
            --frequency-col Total_Purchases --monetary-col Total_Spend \
            --output /tmp/segmentos.csv
          test -s /tmp/segmentos.csv
          lines=$(wc -l < /tmp/segmentos.csv)
          test "$lines" -gt 1

      - name: Variante RFM 333 (rfm_333.py) sobre el CSV de ejemplo
        run: |
          python rfm-333/scripts/rfm_333.py --input rfm-333/ejemplo/clientes_ejemplo.csv \
            --id-col Id_Cliente --date-col Fecha_Ultima_Compra \
            --frequency-col Compras --monetary-col Gasto \
            --output /tmp/rfm333.csv
          test -s /tmp/rfm333.csv

      - name: RFM 333 con --auto-terciles (debe seguir funcionando y avisar de bandas vacías)
        run: |
          python rfm-333/scripts/rfm_333.py --input rfm-333/ejemplo/clientes_ejemplo.csv \
            --id-col Id_Cliente --date-col Fecha_Ultima_Compra \
            --frequency-col Compras --monetary-col Gasto \
            --auto-terciles --output /tmp/rfm333_terciles.csv
